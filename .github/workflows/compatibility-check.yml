# .github/workflows/compatibility-check.yml

name: Node.js Compatibility Check

on: [push, pull_request]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Node.js ${{ matrix.node-version }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      # This is the corrected and recommended way to cache npm.
      # The setup-node action can handle this internally for simplicity.
      - name: Setup Node.js and Cache Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # This is the simplest and most effective way to enable caching for npm.
          cache: 'npm'

      - name: Install Dependencies
        # This will now work because package-lock.json is committed.
        run: npm ci
      
      - name: Run Tests
        run: npm test